plugins {
    id 'com.android.application'
}

android {
    namespace 'md.inkwell.app'
    compileSdk 34

    defaultConfig {
        applicationId 'md.inkwell.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the whole Inkwell web app is bundled under assets/ — don't let AAPT compress it
    aaptOptions {
        noCompress 'js', 'css', 'wasm', 'woff2', 'data'
    }
}

dependencies {
    // serves the bundled web app from a secure in-app origin (local-first, works offline)
    implementation 'androidx.webkit:webkit:1.11.0'
}
